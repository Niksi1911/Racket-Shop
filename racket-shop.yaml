openapi: 3.0.0

info:
  title: Racket Shop API
  version: 1.0.0

paths:

  /rackets:
    get:
      summary: Get all racket sports
      responses:
        '200':
          description: List of racket sports
          content:
            application/json:
              example:
                - tenis
                - padel
                - tableTennis
                - badminton

  /rackets/tenis:
    get:
      summary: Get all tennis rackets
      responses:
        '200':
          description: List of tennis rackets
          content:
            application/json:
              example:
                - name: Wilson Blade 98
                  brand: Wilson
                  price: 219.99
                - name: Head Speed MP
                  brand: Head
                  price: 229.99
                - name: Babolat Pure Aero
                  brand: Babolat
                  price: 239.99

  /rackets/tenis/wilson:
    get:
      summary: Get Wilson tennis rackets
      responses:
        '200':
          description: Wilson tennis rackets
          content:
            application/json:
              example:
                - name: Wilson Blade 98
                  brand: Wilson
                  price: 219.99
                - name: Wilson Clash 100
                  brand: Wilson
                  price: 199.99

  /rackets/tenis/head:
    get:
      summary: Get Head tennis rackets
      responses:
        '200':
          description: Head tennis rackets
          content:
            application/json:
              example:
                - name: Head Speed MP
                  brand: Head
                  price: 229.99

  /rackets/tenis/babolat:
    get:
      summary: Get Babolat tennis rackets
      responses:
        '200':
          description: Babolat tennis rackets
          content:
            application/json:
              example:
                - name: Babolat Pure Aero
                  brand: Babolat
                  price: 239.99

  /rackets/padel:
    get:
      summary: Get all padel rackets
      responses:
        '200':
          description: List of padel rackets
          content:
            application/json:
              example:
                - name: Nox AT10 Genius
                  brand: Nox
                  price: 249.99
                - name: Siux Electra
                  brand: Siux
                  price: 259.99
                - name: Bullpadel Hack
                  brand: Bullpadel
                  price: 269.99

  /rackets/padel/nox:
    get:
      summary: Get Nox padel rackets
      responses:
        '200':
          description: Nox padel rackets
          content:
            application/json:
              example:
                - name: Nox AT10 Genius
                  brand: Nox
                  price: 249.99

  /rackets/padel/siux:
    get:
      summary: Get Siux padel rackets
      responses:
        '200':
          description: Siux padel rackets
          content:
            application/json:
              example:
                - name: Siux Electra
                  brand: Siux
                  price: 259.99

  /rackets/padel/bullpadel:
    get:
      summary: Get Bullpadel padel rackets
      responses:
        '200':
          description: Bullpadel padel rackets
          content:
            application/json:
              example:
                - name: Bullpadel Hack
                  brand: Bullpadel
                  price: 269.99